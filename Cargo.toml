[package]
name = "luma_gallery"
version = "0.1.4"
edition = "2024"
publish = false
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
egui-mobile = { git = "https://github.com/shadowbrok3r/EguiMobile", rev = "31d1cbebead2ea9c52e50e4b6602c2b1f90c6abd" }
egui = "0.36"
egui_extras = { version = "0.36", default-features = false, features = ["image", "svg"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"

[patch.crates-io]
android-activity = { git = "https://github.com/shadowbrok3r/EguiMobile", rev = "31d1cbebead2ea9c52e50e4b6602c2b1f90c6abd" }

[profile.release]
lto = "thin"
strip = "debuginfo"

[package.metadata.android]
package = "app.luma.gallery"
build_targets = ["aarch64-linux-android", "x86_64-linux-android"]
java_sources = "java"
resources = "res"
assets = "assets"
runtime_libs = "native/libs"

[package.metadata.android.sdk]
min_sdk_version = 29
target_sdk_version = 35

[package.metadata.android.signing.release]
path = "/home/shadowbroker/.android/debug.keystore"
keystore_password = "android"

[package.metadata.android.application]
label = "Luma Gallery"
icon = "@mipmap/ic_launcher"
has_code = true
extract_native_libs = true

[[package.metadata.android.application.activity]]
name = "app.luma.gallery.GalleryActivity"
config_changes = "orientation|keyboardHidden|screenSize|screenLayout|density"
window_soft_input_mode = "adjustResize"
[[package.metadata.android.application.activity.meta_data]]
name = "android.app.lib_name"
value = "luma_gallery"
[[package.metadata.android.application.activity.intent_filter]]
actions = ["android.intent.action.MAIN"]
categories = ["android.intent.category.LAUNCHER"]

[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_IMAGES"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VIDEO"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_MEDIA_VISUAL_USER_SELECTED"
[[package.metadata.android.uses_permission]]
name = "android.permission.READ_EXTERNAL_STORAGE"
max_sdk_version = 32
[[package.metadata.android.uses_permission]]
name = "android.permission.MANAGE_MEDIA"
[[package.metadata.android.uses_permission]]
name = "android.permission.VIBRATE"
[[package.metadata.android.uses_permission]]
name = "android.permission.WAKE_LOCK"
